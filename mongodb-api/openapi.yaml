openapi: 3.0.3
info:
  title: Omnichat Admin API
  version: 1.0.0
  description: REST API for LibreChat admin-panel (users, roles, MCP, stats).
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Tokens issued
  /api/auth/refresh:
    post:
      summary: Refresh access token
      responses:
        '200':
          description: New access token
  /api/auth/logout:
    post:
      summary: Invalidate refresh token
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out
  /api/users:
    get:
      summary: List users (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Paginated users
    post:
      summary: Create user
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
  /api/roles:
    get:
      summary: List roles (paginated)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated roles
  /api/mcpservers:
    get:
      summary: List MCP servers (paginated)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated MCP servers
  /api/stats:
    get:
      summary: Aggregated platform stats
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [7d, 30d], default: 30d }
      responses:
        '200':
          description: Stats payload
  /api/agents:
    get:
      summary: List agents (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Paginated agents
    post:
      summary: Create agent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, provider, model]
              properties:
                name: { type: string }
                provider: { type: string }
                model: { type: string }
                description: { type: string }
                instructions: { type: string }
                tools:
                  oneOf:
                    - { type: array, items: { type: string } }
                    - { type: string }
                mcpServerNames:
                  oneOf:
                    - { type: array, items: { type: string } }
                    - { type: string }
                category: { type: string }
                is_promoted: { type: boolean }
      responses:
        '201':
          description: Created
  /api/agents/{id}:
    get:
      summary: Agent detail
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Agent document
        '404':
          description: Not found
    put:
      summary: Update agent
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete agent
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
  /api/conversations:
    get:
      summary: List conversations (paginated, read-only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: user
          schema: { type: string }
      responses:
        '200':
          description: Paginated conversations
  /api/conversations/{id}:
    get:
      summary: Conversation detail
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conversation document
  /api/messages:
    get:
      summary: List messages (paginated, read-only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: conversationId
          schema: { type: string }
        - in: query
          name: user
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Paginated messages
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    Paginated:
      type: object
      properties:
        documents: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
